apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: nginx-base

resources:
- deployment.yaml
- service.yaml
- configmap.yaml

commonLabels:
  app.kubernetes.io/component: webserver
  app.kubernetes.io/name: nginx
  app.kubernetes.io/part-of: argocd-lab

images:
- name: nginx
  newTag: 1.25.3-alpine
