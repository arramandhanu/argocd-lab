apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Values.namespace }}-quota
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: resource-quota
spec:
  hard:
    requests.cpu: "{{ .Values.resourceQuota.requests.cpu | default "4" }}"
    requests.memory: "{{ .Values.resourceQuota.requests.memory | default "8Gi" }}"
    limits.cpu: "{{ .Values.resourceQuota.limits.cpu | default "8" }}"
    limits.memory: "{{ .Values.resourceQuota.limits.memory | default "16Gi" }}"
    pods: "{{ .Values.resourceQuota.pods | default "20" }}"
    services: "{{ .Values.resourceQuota.services | default "10" }}"
    configmaps: "{{ .Values.resourceQuota.configmaps | default "20" }}"
    persistentvolumeclaims: "{{ .Values.resourceQuota.pvc | default "10" }}"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Values.namespace }}-limits
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: limit-range
spec:
  limits:
  - max:
      cpu: "{{ .Values.limitRange.max.cpu | default "2" }}"
      memory: "{{ .Values.limitRange.max.memory | default "1Gi" }}"
    min:
      cpu: "{{ .Values.limitRange.min.cpu | default "10m" }}"
      memory: "{{ .Values.limitRange.min.memory | default "16Mi" }}"
    default:
      cpu: "{{ .Values.limitRange.default.cpu | default "500m" }}"
      memory: "{{ .Values.limitRange.default.memory | default "256Mi" }}"
    defaultRequest:
      cpu: "{{ .Values.limitRange.defaultRequest.cpu | default "50m" }}"
      memory: "{{ .Values.limitRange.defaultRequest.memory | default "64Mi" }}"
    type: Container
