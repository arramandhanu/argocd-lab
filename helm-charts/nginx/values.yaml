# Default values for nginx chart
# Includes production-hardening policies (PDB, PriorityClass, ResourceQuota, LimitRange)
# Override these in environment-specific values files

replicaCount: 1

image:
  repository: nginx
  tag: "1.25.3-alpine"
  pullPolicy: IfNotPresent
  digest: ""  # Set to sha256:... for immutable tags

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 101

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nginx.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1  # Use either minAvailable OR maxUnavailable

priorityClass:
  enabled: false
  value: 100
  globalDefault: false
  description: "Priority class for nginx workloads"

resourceQuota:
  enabled: false
  requests:
    cpu: "4"
    memory: "8Gi"
  limits:
    cpu: "8"
    memory: "16Gi"
  pods: "20"
  services: "10"
  configmaps: "20"
  pvc: "10"

limitRange:
  enabled: false
  max:
    cpu: "2"
    memory: "1Gi"
  min:
    cpu: "10m"
    memory: "16Mi"
  default:
    cpu: "500m"
    memory: "256Mi"
  defaultRequest:
    cpu: "50m"
    memory: "64Mi"

nodeSelector: {}

tolerations: []

affinity: {}

# Lifecycle hooks for graceful shutdown
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - "sleep 5"

# Topology spread for HA
topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule

configMap:
  enabled: true
  data:
    index.html: |
      <!DOCTYPE html>
      <html>
      <head>
        <title>ArgoCD Lab - Nginx</title>
        <style>
          body { font-family: sans-serif; text-align: center; padding: 50px; background: #1a1a2e; color: #fff; }
          h1 { color: #4fc3f7; }
          .env { color: #bb86fc; font-size: 1.2em; }
        </style>
      </head>
      <body>
        <h1>Welcome to ArgoCD Lab</h1>
        <p class="env">Environment: default</p>
        <p>Deployed via GitOps with ArgoCD</p>
      </body>
      </html>

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
