# Sealed Secrets Example
# Install: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/latest/download/controller.yaml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nginx-secrets
  namespace: nginx-helm-dev
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  encryptedData:
    # Generate with: kubeseal --cert cert.pem -f secret.yaml -w sealed-secret.yaml
    API_KEY: AgA...  # Replace with actual sealed data
    DATABASE_URL: AgB...  # Replace with actual sealed data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    type: Opaque
---
# Raw Secret template (before sealing - DO NOT commit this)
apiVersion: v1
kind: Secret
metadata:
  name: nginx-secrets
  namespace: nginx-helm-dev
type: Opaque
stringData:
  API_KEY: "your-api-key-here"
  DATABASE_URL: "postgresql://user:pass@host:5432/db"
