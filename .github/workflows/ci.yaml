name: CI - Validate and Lint

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install yamllint pyyaml

      - name: YAML Lint
        run: |
          set +e
          yamllint -d relaxed -s $(find . -name "*.yaml" -not -path "./.git/*" -not -path "./.github/*" -not -path "./helm-charts/*/templates/*" -not -path "./policies/helm/*")

      - name: Helm Lint
        run: helm lint helm-charts/nginx

      - name: Helm Template
        run: |
          helm template test helm-charts/nginx -f helm-charts/nginx/values-dev.yaml
          helm template test helm-charts/nginx -f helm-charts/nginx/values-staging.yaml
          helm template test helm-charts/nginx -f helm-charts/nginx/values-prod.yaml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
